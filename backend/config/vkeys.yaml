# AegisGuard 虚拟密钥配置文件
# 低侵入接入核心：Agent 使用 vsk- 前缀的虚拟密钥，网关自动替换为真实 API Key

virtual_keys:
  # 示例虚拟密钥 1：开发测试用
  - key_id: vsk-dev-001
    agent_id: agent-dev-001
    real_api_key: sk-your-real-openai-key-here
    scope: write
    session_id: session-dev-001
    rate_limit: 60
    expires_at: "2026-12-31T23:59:59Z"
    created_at: "2025-01-01T00:00:00Z"
    enabled: true

  # 示例虚拟密钥 2：只读权限
  - key_id: vsk-readonly-001
    agent_id: agent-readonly-001
    real_api_key: sk-your-real-openai-key-here
    scope: read
    session_id: session-readonly-001
    rate_limit: 30
    expires_at: "2026-12-31T23:59:59Z"
    created_at: "2025-01-01T00:00:00Z"
    enabled: true

  # 示例虚拟密钥 3：管理员权限
  - key_id: vsk-admin-001
    agent_id: agent-admin-001
    real_api_key: sk-your-real-openai-key-here
    scope: admin
    session_id: session-admin-001
    rate_limit: 120
    expires_at: "2026-12-31T23:59:59Z"
    created_at: "2025-01-01T00:00:00Z"
    enabled: true

  # 测试 Agent 虚拟密钥 - 用于接入测试
  # Agent 原配置：
  #   OPENAI_API_KEY=sk-e1eexxxxxxb9c89xxxxxxxxddf93ee535c4c2dff522a1a78
  #   OPENAI_BASE_URL=https://api.qnaigc.com/v1
  #   OPENAI_MODEL_NAME=deepseek/deepseek-v3.2-251201
  - key_id: vsk-test-agent-001
    agent_id: test-agent-001
    real_api_key: sk-e1eeb1a96e487ab9065c89a18997f5bb4bf7149ddf93ee535c4c2dff522a1a78
    scope: write
    session_id: session-test-001
    rate_limit: 100
    expires_at: "2026-12-31T23:59:59Z"
    created_at: "2025-01-01T00:00:00Z"
    enabled: true

# 配置说明：
# - key_id: 虚拟密钥 ID，必须以 vsk- 开头，Agent 使用此密钥访问网关
# - agent_id: Agent 唯一标识，用于审计和权限控制
# - real_api_key: 真实的 LLM API Key (sk-xxx)，网关会自动替换
# - scope: 权限范围 - read(只读) / write(读写) / admin(管理)
# - rate_limit: 每分钟最大请求数，0 表示无限制
# - expires_at: 过期时间，ISO 8601 格式
# - enabled: 是否启用

# 使用方式：
# 1. 将 real_api_key 替换为你的真实 OpenAI API Key
# 2. 启动网关: go run cmd/server/main.go
# 3. Agent 配置:
#    OPENAI_BASE_URL=http://localhost:8080/v1
#    OPENAI_API_KEY=vsk-dev-001
